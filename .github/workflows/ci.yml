name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo codegen typecheck lint test
      - name: wrangler types are current
        run: pnpm --filter @request.news/api exec wrangler types --strict-vars=false --check
      - name: dry-run deploy (api)
        run: pnpm --filter @request.news/api exec wrangler deploy --dry-run --outdir dist
      - name: dry-run deploy (web)
        run: pnpm --filter @request.news/web exec wrangler deploy --dry-run --outdir out
      - name: ownership (PRs from ws/* branches)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ws/')
        run: |
          WS=$(echo "${{ github.head_ref }}" | sed -E 's#^ws/([a-z])-.*#\1#' | tr a-z A-Z)
          pnpm tsx scripts/check-ownership.ts "$WS" "origin/${{ github.base_ref }}"
